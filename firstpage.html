<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive 3D Animated Gallery with Vibrant Nature Background</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Arial", sans-serif;
        perspective: 1500px;
        background: #0a1a0a;
      }

      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: url("images/background-image.avif") no-repeat center
          center/cover;
        opacity: 0.4;
        animation: subtleZoom 20s ease-in-out infinite;
      }

      @keyframes subtleZoom {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      canvas#bgCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .nature-overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: radial-gradient(
            circle at 30% 30%,
            rgba(50, 205, 50, 0.3) 0%,
            transparent 60%
          ),
          radial-gradient(
            circle at 70% 70%,
            rgba(0, 191, 255, 0.3) 0%,
            transparent 60%
          );
        opacity: 0.6;
        z-index: -1;
        animation: glowPulse 15s ease-in-out infinite;
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.05);
        }
      }

      .gallery {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        position: absolute;
        width: 20vw;
        max-width: 300px;
        min-width: 150px;
        aspect-ratio: 3 / 4;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        transform-style: preserve-3d;
        transition: all 0.5s ease;
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 15px;
      }

      .card:hover {
        transform: translateZ(50px) rotateY(10deg);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      }

      .glow {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.3) 0%,
          transparent 70%
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card:hover .glow {
        opacity: 1;
      }

      @keyframes orbit {
        0% {
          transform: rotateY(0deg) translateZ(calc(20vw + 100px)) rotateY(0deg);
        }
        100% {
          transform: rotateY(360deg) translateZ(calc(20vw + 100px))
            rotateY(-360deg);
        }
      }

      .welcome-button {
        position: fixed;
        bottom: 2vw;
        right: 2vw;
        padding: 1rem 2rem;
        background: linear-gradient(45deg, #32cd32, #00b7eb);
        color: white;
        font-size: clamp(14px, 2vw, 16px);
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        opacity: 0;
        transform: translateY(-20px);
        transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease;
        z-index: 10;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .welcome-button.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .welcome-button:hover {
        box-shadow: 0 6px 20px rgba(50, 205, 50, 0.5);
        background: linear-gradient(45deg, #00b7eb, #32cd32);
      }

      /* Media Queries for Responsiveness */
      @media screen and (max-width: 768px) {
        .card {
          width: 30vw;
          min-width: 120px;
        }

        @keyframes orbit {
          0% {
            transform: rotateY(0deg) translateZ(calc(15vw + 80px)) rotateY(0deg);
          }
          100% {
            transform: rotateY(360deg) translateZ(calc(15vw + 80px))
              rotateY(-360deg);
          }
        }

        
      }

      @media screen and (max-width: 480px) {
        .card {
          width: 35vw;
          min-width: 100px;
        }

        @keyframes orbit {
          0% {
            transform: rotateY(0deg) translateZ(calc(12vw + 60px)) rotateY(0deg);
          }
          100% {
            transform: rotateY(360deg) translateZ(calc(12vw + 60px))
              rotateY(-360deg);
          }
        }

      

        .nature-overlay {
          background: radial-gradient(
              circle at 30% 30%,
              rgba(50, 205, 50, 0.2) 0%,
              transparent 50%
            ),
            radial-gradient(
              circle at 70% 70%,
              rgba(0, 191, 255, 0.2) 0%,
              transparent 50%
            );
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <canvas id="bgCanvas"></canvas>
    <div class="nature-overlay"></div>
    <button
      class="welcome-button"
      id="welcomeButton"
      onclick="window.location.href='welcome.html'"
    >
      Welcome
    </button>
    <div class="gallery">
      <div class="card" style="animation: orbit 20s linear infinite">
        <img src="images/pic14.jpg" alt="Image 1" />
        <div class="glow"></div>
      </div>
      <div class="card" style="animation: orbit 20s linear infinite 4s">
        <img src="images/pic13.jpg" alt="Image 2" />
        <div class="glow"></div>
      </div>
      <div class="card" style="animation: orbit 20s linear infinite 8s">
        <img src="images/pic11.jpg" alt="Image 3" />
        <div class="glow"></div>
      </div>
      <div class="card" style="animation: orbit 20s linear infinite 12s">
        <img src="images/pic12.jpg" alt="Image 4" />
        <div class="glow"></div>
      </div>
      <div class="card" style="animation: orbit 20s linear infinite 16s">
        <img src="images/pic15.jpg" alt="Image 5" />
        <div class="glow"></div>
      </div>
    </div>

    <script>
      // Show Welcome button after 50 seconds
      const welcomeButton = document.getElementById("welcomeButton");
      setTimeout(() => {
        welcomeButton.classList.add("visible");
      }, 50000);

      // Canvas background with animated nature-inspired particles
      const canvas = document.getElementById("bgCanvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();

      const particles = [];
      const numParticles = Math.min(100, Math.floor(window.innerWidth / 10));

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 4 + 1;
          this.speedX = Math.random() * 0.3 - 0.15;
          this.speedY = Math.random() * 0.3 - 0.15;
          this.opacity = Math.random() * 0.5 + 0.3;
          this.color =
            Math.random() > 0.5 ? "rgba(50, 205, 50, " : "rgba(0, 191, 255, ";
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `${this.color}${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle());
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((particle) => {
          particle.update();
          particle.draw();
        });
        requestAnimationFrame(animateParticles);
      }

      animateParticles();

      // Card interactions
      const cards = document.querySelectorAll(".card");

      cards.forEach((card, index) => {
        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = (y - centerY) / 20;
          const rotateY = (centerX - x) / 20;

          card.style.transform = `translateZ(50px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener("mouseleave", () => {
          card.style.transform = "translateZ(0px) rotateX(0deg) rotateY(0deg)";
        });
      });

      // Parallax effect
      document.addEventListener("mousemove", (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 50;
        const y = (window.innerHeight / 2 - e.clientY) / 50;
        document.querySelector(
          ".nature-overlay"
        ).style.transform = `translate(${x}px, ${y}px)`;
        document.querySelector(".background").style.transform = `translate(${
          x / 2
        }px, ${y / 2}px) scale(1.1)`;
      });

      // Dynamic lighting effect
      const glows = document.querySelectorAll(".glow");
      document.addEventListener("mousemove", (e) => {
        glows.forEach((glow) => {
          const card = glow.parentElement;
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          glow.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255, 255, 255, 0.3) 0%, transparent 70%)`;
        });
      });

      // Handle window resize
      window.addEventListener("resize", () => {
        resizeCanvas();
        particles.length = 0;
        const newNumParticles = Math.min(
          100,
          Math.floor(window.innerWidth / 10)
        );
        for (let i = 0; i < newNumParticles; i++) {
          particles.push(new Particle());
        }
      });
    </script>
  </body>
</html>
